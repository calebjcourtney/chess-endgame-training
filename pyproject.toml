[project]
name = "chess-endgame-training"
version = "0.1.0"
description = "Generate chess positions for finding checkmate in a set number of moves."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dash (>=4.4.1,<5.0.0)", "flask (>=3.1.3,<4.0.0)", "pandas (>=3.1.0,<4.0.0)", "python-chess (>=1.999,<2.0)", "gunicorn (>=26.2.0,<27.0.0)", "tqdm (>=4.70.1,<5.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
